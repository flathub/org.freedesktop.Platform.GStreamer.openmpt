id: org.freedesktop.Platform.GStreamer.openmpt
branch: '24.08'
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false

build-options:
  # build to extension dir (only extension directory is persisted between modules, not /app or /usr)
  prefix: /usr/lib/extensions/gstreamer-1.0/openmpt
  prepend-pkg-config-path: /usr/lib/extensions/gstreamer-1.0/openmpt/lib/pkgconfig
  env:
    FLATPAK_LIBDIR: /usr/lib/extensions/gstreamer-1.0/openmpt/
  strip: true

cleanup:
  - /include
  - /bin
  - /lib/pkgconfig
  - /lib/libgst*
  - /lib/*.a
  - /lib/*.la
  - /libexec
  - /share/doc

modules:
  - name: libopenmpt
    buildsystem: autotools
    config-opts:
      - --without-portaudio
      - --disable-openmpt123
      - --disable-examples
      - --disable-tests
    sources:
      - type: archive
        url: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.7.11+release.autotools.tar.gz
        sha512: f155f2c6f1d6a449ae0153976cd549b29ce1808f2655f6c9798f9fb0b7ad682ce8aa2fd54098817113519ec28ffeb3b531cca0901e5a897e45da14e639d5fe72
        x-checker-data:
          type: anitya
          project-id: 141468
          url-template: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-$version+release.autotools.tar.gz

  - name: gstreamer-plugins-bad
    buildsystem: meson
    builddir: true
    config-opts:
      # build only openmpt plugin
      - -Dauto_features=disabled
      - -Dgood=disabled
      - -Dugly=disabled
      - -Dbad=enabled
      - -Dgst-plugins-bad:openmpt=enabled
      - -Dgst-full-plugins=openmpt
      - --buildtype=release
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/gstreamer/gstreamer.git
        tag: 1.24.7 # matches o.fd.P//24.08
        disable-submodules: true
        # no update checker information here, needs to stay pinned to ver in runtime
    # only install the plugin, none of the other gstreamer files
    no-make-install: true
    post-install:
      - install -D subprojects/gst-plugins-bad/ext/openmpt/libgstopenmpt.so ${FLATPAK_LIBDIR}

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: org.freedesktop.Platform.GStreamer.openmpt.metainfo.xml
