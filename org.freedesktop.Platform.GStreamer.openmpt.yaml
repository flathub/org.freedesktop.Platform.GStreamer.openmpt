id: org.freedesktop.Platform.GStreamer.openmpt
branch: '26.08'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false

build-options:
  # build to extension dir (only extension directory is persisted between modules, not /app or /usr)
  prefix: /usr/lib/extensions/gstreamer-1.0/openmpt
  prepend-pkg-config-path: /usr/lib/extensions/gstreamer-1.0/openmpt/lib/pkgconfig
  env:
    FLATPAK_LIBDIR: /usr/lib/extensions/gstreamer-1.0/openmpt/
  strip: true

cleanup:
  - /include
  - /bin
  - /lib/pkgconfig
  - /lib/libgst*
  - /lib/*.a
  - /lib/*.la
  - /libexec
  - /share/doc

modules:
  - name: libopenmpt
    buildsystem: autotools
    config-opts:
      - --without-portaudio
      - --disable-openmpt123
      - --disable-examples
      - --disable-tests
    sources:
      - type: archive
        url: 
          https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.10+release.autotools.tar.gz
        sha512: 
          c6eba868e1f9b65a1c8a4829b461ffe8a1411527336de31131e1f2494f271d2f364ec6f884cbcd93bea7dedb85e18a601fb4537ebdee8f7a3c1eb6116ca7d592
        x-checker-data:
          type: anitya
          project-id: 141468
          url-template: 
            https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-$version+release.autotools.tar.gz

  - name: gstreamer-plugins-bad
    buildsystem: meson
    builddir: true
    config-opts:
      # build only openmpt plugin
      - -Dauto_features=disabled
      - -Dgood=disabled
      - -Dugly=disabled
      - -Dbad=enabled
      - -Dgst-plugins-bad:openmpt=enabled
      - -Dgst-full-plugins=openmpt
      - --buildtype=release
      # not required, hack to fix build error (variable "plugins_cache_generator" not found)
      # upstream issue: https://gitlab.freedesktop.org/gstreamer/gstreamer/-/work_items/5094
      - -Dgstreamer:check=enabled
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/gstreamer/gstreamer.git
        tag: 1.28.6 # matches o.fd.P//26.08
        commit: 2d3e05cbdad68e47d645f548899b432dc9fb4473 # tag 1.28.6
        disable-submodules: true
        # no update checker information here, needs to stay pinned to ver in runtime
    # only install the plugin, none of the other gstreamer files
    no-make-install: true
    post-install:
      - install -D subprojects/gst-plugins-bad/ext/openmpt/libgstopenmpt.so ${FLATPAK_LIBDIR}

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: org.freedesktop.Platform.GStreamer.openmpt.metainfo.xml
